# GitHub Actions 파이프라인의 이름 (대시보드 표시)
name: Workhelper Backend Server CI/CD

# main 브랜치에 코드가 push될 때 해당 파이프라인 자동 실행
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    # 파이프라인이 실행될 환경, 실제 서버가 아닌 GitHub Actions에서 AWS로 명령을 보내는 가상 빌드 서버
    # 이 가상 서버(Runner)는 매번 깨끗한 최신 우분투 환경으로 떴다가 작업이 끝나면 사라지기 때문에
    # 빌드 도구(Java, Gradle, Docker CLI 등)가 안정적으로 잘 갖춰진 최신형 우분투(ubuntu-latest)를 쓰는 것을 권장
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. 소스 코드 체크아웃
        uses: actions/checkout@v4 # 현재 리포지토리 소스를 가상 서버로 불러옴

      - name: 2. JDK 17 설정 (Gradle 빌드용)
        uses: actions/setup-java@v4 # 자바 개발 환경 세팅
        with:
          distribution: 'temurin' # 사용할 자바 배포판
          java-version: '17' # 자바 버전 지정

      - name: 3. Gradle Wrapper 권한 부여 및 빌드 (jar 생성)
        run: | # gradlew 실행 권한 부여 및 스프링 부트 jar 파일 빌드 수행 (테스트 제외)
          chmod +x ./gradlew
          ./gradlew bootJar -x test 

      - name: 4. Docker Buildx 설정
        uses: docker/setup-buildx-action@v3 # 멀티 플랫폼 도커 이미지 빌드를 위한 도구 설정

      - name: 5. Docker Hub 로그인
        uses: docker/login-action@v3 # 빌드한 도커 이미지를 Docker Hub에 업로드하기 위해 로그인
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # GitHub Secrets에 등록한 도커 허브 아이디
          password: ${{ secrets.DOCKERHUB_TOKEN }} # GitHub Secrets에 등록한 도커 허브 토큰(비밀번호)

      - name: 6. Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: . # 현재 프로젝트 루트를 기준으로 빌드 진행 (Dockerfile 위치)
          push: true # 빌드가 끝나면 Docker Hub로 이미지 업로드(푸시) 수행
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/workhelper-backend:latest # 업로드할 도커 이미지의 이름과 태그 설정

      - name: 7. AWS EC2에 SSH로 접속하여 최신 이미지 pull 및 재시작
        uses: appleboy/ssh-action@master # SSH를 통해 원격 서버(EC2)에 안전하게 접속하는 액션
        with:
          host: ${{ secrets.EC2_HOST }} # AWS EC2 퍼블릭 IP 주소
          username: ${{ secrets.EC2_USERNAME }} # EC2 접속 계정 (예: ubuntu)
          key: ${{ secrets.EC2_SSH_KEY }} # EC2 접속용 .pem 프라이빗 키 전체 내용
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/workhelper-backend:latest # Docker Hub에서 최신 이미지 다운로드
            sudo docker stop workhelper-app || true # 기존에 실행 중이던 컨테이너가 있다면 중지 (없어도 에러 안 나게 처리)
            sudo docker rm workhelper-app || true # 기존 컨테이너 삭제
            sudo docker run -d --name workhelper-app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/workhelper-backend:latest # 다운받은 최신 이미지를 8080 포트로 백그라운드(-d) 실행