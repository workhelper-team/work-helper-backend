spring:
  application:
    name: work-helper-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 1800000

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
  read-timeout: ${AI_READ_TIMEOUT:120s}

storage:
  type: ${STORAGE_TYPE:local}
  local-root: ${STORAGE_LOCAL_ROOT:uploads}
  s3:
    bucket: ${STORAGE_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-duration: ${S3_PRESIGNED_URL_DURATION:10m}
